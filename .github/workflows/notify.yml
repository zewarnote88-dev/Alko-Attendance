name: Daily entry reminder
on:
  schedule:
    - cron: "17 6 * * *"          # 09:17 Baghdad — yesterday's data (work day 8→8) is complete
    - cron: "45 3,11,15,19 * * *" # 06:45 / 14:45 / 18:45 / 22:45 Baghdad — ~1h before shifts end (08/16/20/24)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or shift"
        type: choice
        options: [daily, shift]
        default: daily
      test:
        description: "Send a test notification to every device"
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --prefix .github/notify @supabase/supabase-js@2 web-push@3
      - run: node .github/notify/notify.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TEST: ${{ inputs.test }}
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 6 * * *' && 'daily' || 'shift') || inputs.mode }}
